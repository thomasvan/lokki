[package]
name = "lokki_app"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "lokki"
path = "src/main.rs"

[dependencies]
lokki_logic = { path = "logic" }
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-clipboard-manager = "=2.4.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "=3.27.0"
tauri = { version = "=2.12.3", features = ["test"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[workspace]
members = ["logic"]
resolver = "2"
