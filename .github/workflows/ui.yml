name: ui

on:
  push:
    paths: ["ui/**", ".github/workflows/ui.yml", "core/lokki_core/**", "core/VERSION", "core/test_quota_reader.py"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml", "core/lokki_core/**", "core/VERSION", "core/test_quota_reader.py"]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI checks, tests and the browser run
    # The e2e starts a real core against a fake CLIProxyAPI on loopback, under RUNNER_TEMP.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the core
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Check
        working-directory: ui
        run: npm run check
      - name: Component tests
        working-directory: ui
        run: npm test
      - name: Chromium and WebKit from an earlier run
        # Its CDN is reached only on a miss: from GitHub's runners it has served another host's certificate.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Browser
        # Chromium and WebKit, unless the cache had them, and the system libraries they need, which the runner image does not carry.
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit
      - name: Build and the browser run
        working-directory: ui
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run e2e
