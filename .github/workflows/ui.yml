name: ui

on:
  push:
    paths: ["ui/**", "app/src-tauri/dist/error.html", "docs/design/ux/wordmark-*.svg", ".github/workflows/ui.yml", "core/lokki_core/**", "core/VERSION", "core/test_quota_reader.py"]
  pull_request:
    paths: ["ui/**", "app/src-tauri/dist/error.html", "docs/design/ux/wordmark-*.svg", ".github/workflows/ui.yml", "core/lokki_core/**", "core/VERSION", "core/test_quota_reader.py"]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI checks, tests and the browser run
    # The e2e starts a real core against a fake CLIProxyAPI on loopback, under RUNNER_TEMP.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the core
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Check
        working-directory: ui
        run: npm run check
      - name: Component tests
        working-directory: ui
        run: npm test
      - name: Chromium and WebKit from an earlier run
        # Its CDN is reached only on a miss: from GitHub's runners it has served another host's certificate.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Which Playwright and which runner image the system libraries were fetched for
        id: libs
        working-directory: ui
        run: |
          echo "playwright=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: System libraries (.deb files) from an earlier run
        # What `playwright install --with-deps` fetches from the apt mirror, kept so that a normal run downloads nothing from it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ steps.libs.outputs.image }}-${{ steps.libs.outputs.playwright }}
      - name: Browser
        # Chromium and WebKit, and the system libraries they need, which the runner image does not carry.
        # With the .deb files cached, dpkg installs them directly: no apt, so no index and no mirror (apt's own resolution
        # against the image's older index asks for archives the cache does not hold).
        # Without them (a new Playwright or runner image), `--with-deps` fetches them from the apt mirror. So does a run whose
        # restored entry dpkg cannot install, and it warns: a hit is never saved again, so every run fetches until a new image
        # or Playwright changes the key, or `gh cache delete` removes the entry.
        # The fetch usually takes under a minute, but the image's first mirror, azure.archive.ubuntu.com, can crawl at
        # ~170 kB/s for over half an hour. So each attempt gets 180 s and there is one retry, through archive.ubuntu.com:
        # at most 595 s, under 10 minutes of the job's 30, counting the kill grace, the lock wait, the wait after a kill
        # and the bounded finish of a killed dpkg run. Here `timeout` runs as the user, above the sudo that Playwright runs
        # apt under; no run has cut this step's attempt, so which processes its signal reaches is not shown. The retry waits
        # for apt, kills and finishes what is left as apt-install.sh does (the script says what a hosted run showed), so a
        # killed attempt cannot leave the lock held. apt resumes partial downloads. Any other early end names its command in
        # an ::error::.
        working-directory: ui
        run: |
          trap 'echo "::error::The Browser step, line $LINENO: \`$BASH_COMMAND\` failed with exit $?."' ERR
          debs="$HOME/playwright-debs"
          if ls "$debs"/*.deb >/dev/null 2>&1; then
            if sudo dpkg -i "$debs"/*.deb; then
              timeout --kill-after=15 180 npx playwright install chromium webkit
              exit 0
            fi
            echo "::warning::The cached .deb files did not install; this run fetches them, and so will every run until the cache key changes or the entry is deleted."
          fi
          attempt() { timeout --kill-after=15 "$1" npx playwright install --with-deps chromium webkit; }
          if ! attempt 180; then
            echo "::warning::The first attempt failed or ran out of time; retrying once, through archive.ubuntu.com."
            # apt, apt-get and dpkg gone within $1 checks 2 s apart
            gone() { for _ in $(seq "$1"); do pgrep -x 'apt|apt-get|dpkg' >/dev/null || return 0; sleep 2; done; return 1; }
            if ! gone 30; then
              # `pkill -s` kills the sessions these pids lead; a dpkg that leads none kills nothing more.
              if sessions=$(pgrep -d, -x dpkg); then sudo pkill -KILL -s "$sessions" || true; fi
              sudo pkill -KILL -x 'apt|apt-get|dpkg' || true
              gone 5 || { echo "::error::apt or dpkg was still running 10 s after SIGKILL, so the retry cannot install."; exit 1; }
            fi
            finish=0
            sudo timeout --kill-after=15 120 dpkg --configure -a || finish=$?
            case "$finish" in
              0) ;;
              124|137) echo "::error::dpkg --configure -a did not finish the first attempt's half-done run within 120 s, so the retry cannot install."; exit 1 ;;
              *) echo "::error::dpkg --configure -a failed with exit $finish, so the retry cannot install."; exit 1 ;;
            esac
            [ -f /etc/apt/apt-mirrors.txt ] \
              || { echo "::error::The image has no /etc/apt/apt-mirrors.txt, so the retry has no mirror list to point at archive.ubuntu.com."; exit 1; }
            # Only this attempt: the image's mirror list is put back when the step ends, whatever way it ends.
            sudo cp /etc/apt/apt-mirrors.txt "$RUNNER_TEMP/apt-mirrors.txt"
            # A function: the ERR trap does not reach into one, so a restore that fails is named once, by its own line.
            restore() {
              sudo cp "$RUNNER_TEMP/apt-mirrors.txt" /etc/apt/apt-mirrors.txt \
                || { echo "::error::The Browser step could not put the image's mirror list back into /etc/apt/apt-mirrors.txt."; exit 1; }
            }
            trap restore EXIT
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            attempt 180 || { echo "::error::Chromium and WebKit did not install in two attempts of 180 s each."; exit 1; }
          fi
          mkdir -p "$debs"
          # A fetch that downloaded nothing leaves no .deb to keep, and is a good fetch.
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$debs" {} +
      - name: Build and the browser run
        working-directory: ui
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run e2e
