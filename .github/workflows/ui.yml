name: ui

on:
  push:
    paths: ["ui/**", ".github/workflows/ui.yml", "core/lokki_core/**", "core/VERSION", "core/test_quota_reader.py"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml", "core/lokki_core/**", "core/VERSION", "core/test_quota_reader.py"]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI checks, tests and the browser run
    # The e2e starts a real core against a fake CLIProxyAPI on loopback, under RUNNER_TEMP.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the core
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Check
        working-directory: ui
        run: npm run check
      - name: Component tests
        working-directory: ui
        run: npm test
      - name: Chromium and WebKit from an earlier run
        # Its CDN is reached only on a miss: from GitHub's runners it has served another host's certificate.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: TEMP diag
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; . /etc/os-release; echo $VERSION_CODENAME
          ls -la /etc/apt /etc/apt/sources.list.d /etc/apt/apt.conf.d; cat /etc/apt/sources.list.d/* 2>/dev/null | head -60; cat /etc/apt/sources.list 2>/dev/null | head
          cat /etc/apt/apt-mirrors.txt; ls /var/lib/apt/lists | head; ls /var/cache/apt/archives | head; grep -r "Keep-Downloaded\|docker-clean" /etc/apt/apt.conf.d || true
          ls /usr/share/keyrings; sudo -V | head -1; sudo grep -r . /etc/sudoers.d 2>/dev/null | head
      - name: Browser
        # Chromium and WebKit, unless the cache had them, and the system libraries they need, which the runner image does not carry.
        working-directory: ui
        # A run takes 8-31 s unless the apt mirror crawls: two runs went 14 and 30+ minutes downloading 142 MB at ~170 kB/s.
        # So each attempt gets 180 s (six times the slowest normal run) and there is one retry: about 7 minutes of the job's 30, counting the kill grace and the lock wait.
        # `timeout` signals the whole process group, and sudo relays the signal to apt; the retry waits for apt and dpkg to exit,
        # then finishes any half-done dpkg run, so a killed attempt cannot leave the lock held. apt resumes partial downloads.
        run: |
          attempt() { timeout --kill-after=15 180 npx playwright install --with-deps chromium webkit; }
          if ! attempt; then
            echo "::warning::The first attempt failed or ran past 180 s; retrying once."
            for _ in $(seq 30); do pgrep -x 'apt|apt-get|dpkg' >/dev/null || break; sleep 2; done
            sudo pkill -x 'apt|apt-get' || true
            sudo dpkg --configure -a
            attempt || { echo "::error::Chromium and WebKit did not install in two attempts of 180 s each."; exit 1; }
          fi
      - name: Build and the browser run
        working-directory: ui
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run e2e
