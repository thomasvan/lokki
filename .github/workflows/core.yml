name: core

on:
  push:
    paths: ["core/**", "deploy/docker-compose.relay-8381.yml", "deploy/relay/Dockerfile", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "deploy/docker-compose.relay-8381.yml", "deploy/relay/Dockerfile", ".github/workflows/core.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: Suite on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install pyyaml
      - name: Typecheck
        run: python -c "import server"
        working-directory: core
      - name: Run the test suite
        # The run log goes under RUNNER_TEMP: log_run refuses a path inside the checkout.
        # ci_quiet_suite.py runs the same discovery and also fails the step on any output
        # a test did not ask for, or any file left in TMPDIR.
        run: python ci_quiet_suite.py
        working-directory: core
        env:
          RELAY_RUNS_LOG: ${{ runner.temp }}/runs.jsonl
