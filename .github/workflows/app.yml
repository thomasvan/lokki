name: app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/**", "core/**", "ui/**"]
  pull_request:
    # The reader's management major, the page's typed hooks and every workflow are checked by this workflow's tests.
    paths: ["app/**", ".github/workflows/**", "core/lokki_core/quota/reader.py", "ui/src/lib/lokki.d.ts"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build (v<core/VERSION>, already pushed); empty runs the CI jobs only"
        default: ""
      platforms:
        description: "all, or linux for a deliberate Linux-only release"
        default: "all"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_BUILD_PACKAGES: "pyyaml==6.0.3 pyinstaller==6.22.3"

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    # paths do not filter a tag push; a release run has its own jobs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.tag == '') }}
    name: Linux build, tests and the headless smoke
    # Pinned, not ubuntu-latest: the installers' glibc floor is this image's (README.md), and
    # the AppImage carries its WebKitGTK.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      APPIMAGE_EXTRACT_AND_RUN: "1"
      LINUX_PACKAGES: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config patchelf file xvfb xauth dbus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Which runner image and which packages the .deb files are fetched for
        id: debs
        run: echo "key=app-linux-debs-$ImageOS-$ImageVersion-$(printf %s "$LINUX_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Tauri's Linux packages and the smoke's display (.deb files) from an earlier run
        # What the next step fetches from the apt mirror, kept so that a normal run downloads only the index from it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.debs.outputs.key }}
      - name: Tauri's Linux packages and the smoke's display
        # Bounded, with one retry through another mirror (the script says why).
        run: bash app/scripts/apt-install.sh --debs ~/apt-debs $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, on master
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: Python for the core sidecar
        run: pip install ${{ env.PYTHON_BUILD_PACKAGES }}
      - name: Versions
        run: cargo --version && rustc --version && node --version && pyinstaller --version
      - name: Script tests
        working-directory: app/scripts
        run: python3 -m unittest
      - name: The lock's CLIProxyAPI major is the reader's
        working-directory: app/scripts
        run: python3 check_lock_major.py --lock ../cliproxy.lock --reader ../../core/lokki_core/quota/reader.py
      - name: Injected script
        working-directory: app
        run: node --test 'inject/*.test.mjs'
      - name: UI build
        working-directory: ui
        run: npm ci && npm run build
      - name: Sidecars
        working-directory: app
        run: |
          python scripts/fetch_cliproxy.py --lock cliproxy.lock --target x86_64-unknown-linux-gnu --out src-tauri/binaries
          python scripts/fetch_cliproxy.py --lock cliproxy.lock --target x86_64-unknown-linux-gnu --out src-tauri/binaries --check
          python scripts/build_core.py --out src-tauri/binaries --triple x86_64-unknown-linux-gnu --run
      - name: Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: app/src-tauri
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --locked --workspace
      - name: Build the installers
        # AppImage bundling downloads linuxdeploy and appimagetool from GitHub.
        working-directory: app
        run: |
          python scripts/sidecars.py --config-json --out "$RUNNER_TEMP/tauri.json"
          npm ci && npm run tauri build -- --bundles deb,appimage --config "$RUNNER_TEMP/tauri.json" -- --locked
      - name: Headless smoke
        working-directory: app
        run: bash smoke/smoke.sh
      - name: Keep the installers
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lokki-linux-x86_64
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  hosted:
    name: Installers on ${{ matrix.os }}
    # Where the Linux job runs. The slowest leg, Intel macOS, takes about 15 minutes cold.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.tag == '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, triple: aarch64-apple-darwin, bundles: dmg }
          - { os: macos-15-intel, triple: x86_64-apple-darwin, bundles: dmg }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, on master
        with: { toolchain: stable }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: pip install ${{ env.PYTHON_BUILD_PACKAGES }}
        shell: bash
      - run: cd ui && npm ci && npm run build
        shell: bash
      - name: Sidecars, each run once
        # PyInstaller on macOS and Windows is built and exercised once per target.
        shell: bash
        run: cd app && python scripts/fetch_cliproxy.py --lock cliproxy.lock --target ${{ matrix.triple }} --out src-tauri/binaries && python scripts/fetch_cliproxy.py --lock cliproxy.lock --target ${{ matrix.triple }} --out src-tauri/binaries --check && python scripts/build_core.py --out src-tauri/binaries --triple ${{ matrix.triple }} --run
      - shell: bash
        run: cd app && python scripts/sidecars.py --config-json --out "$RUNNER_TEMP/tauri.json" && npm ci && npm run tauri build -- --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/tauri.json" -- --locked
      - name: The Windows shell opens no console window
        if: runner.os == 'Windows'
        shell: bash
        run: python app/scripts/check_pe_subsystem.py app/src-tauri/target/release/lokki.exe --want windows
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lokki-${{ matrix.triple }}
          path: app/src-tauri/target/release/bundle/
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  rust:
    name: Rust lint and tests on ${{ matrix.os }}
    # Where the Linux job runs. The shell's Windows and macOS code (the job a sidecar runs in,
    # the stop it hears, what holds a port) is compiled and tested only here.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.tag == '') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, on master
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - name: Python for the build script and the core's init test
        shell: bash
        run: pip install ${{ env.PYTHON_BUILD_PACKAGES }}
      - name: Rust lint
        working-directory: app/src-tauri
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --locked --workspace

  prepare:
    name: The draft release
    # A dispatch on a tag ref with no tag input is a CI run, not a release.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The tag's own tree, whatever branch a dispatch came from; a tag that is not pushed
      # fails here, before anything is created.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0, ref: "refs/tags/${{ inputs.tag || github.ref_name }}" }
      - id: tag
        name: The tag is core/VERSION and the key is the release key
        working-directory: app/scripts
        run: |
          python3 release_manifest.py --check-tag "$TAG"
          python3 release_manifest.py --check-pubkey ../src-tauri/tauri.conf.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: The notes and the draft
        # A draft an earlier run left (a failed hosted leg, a Linux-only dispatch after the push) is reused; a released tag is refused.
        working-directory: app/scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          ACTION="$(python3 release_manifest.py --release-action "$TAG" --releases "$RUNNER_TEMP/releases.json")"
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          BEFORE=""
          if [ -n "$PREV" ]; then git show "$PREV:app/cliproxy.lock" > "$RUNNER_TEMP/lock.before"; BEFORE="--lock-before $RUNNER_TEMP/lock.before"; fi
          NEW="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' ../cliproxy.lock)"
          gh release view "v$NEW" -R router-for-me/CLIProxyAPI --json body --jq .body > "$RUNNER_TEMP/cliproxy.md" || : > "$RUNNER_TEMP/cliproxy.md"
          { [ -z "$PREV" ] || git log --first-parent --format=%s "$PREV..$TAG"; } | python3 release_notes.py $BEFORE --lock-after ../cliproxy.lock --cliproxy-notes "$RUNNER_TEMP/cliproxy.md" > "$RUNNER_TEMP/notes.md"
          if [ "$ACTION" = reuse ]; then
            gh release edit "$TAG" --title "lokki ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --draft --verify-tag --title "lokki ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" -R "$GITHUB_REPOSITORY"
          fi

  release-linux:
    name: The Linux installers, signed
    needs: prepare
    # The CI job's image; no cache, so a release builds from the tag alone, and apt authenticates
    # every package it installs against the archive's signed index.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      APPIMAGE_EXTRACT_AND_RUN: "1"
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "refs/tags/${{ needs.prepare.outputs.tag }}" }
      - name: Tauri's Linux packages
        # The CI job's packages, less the smoke's display.
        run: bash app/scripts/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config patchelf file
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, on master
        with: { toolchain: stable }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: Python for the core sidecar
        run: pip install ${{ env.PYTHON_BUILD_PACKAGES }}
      - name: UI build
        working-directory: ui
        run: npm ci && npm run build
      - name: Sidecars
        working-directory: app
        run: |
          python scripts/fetch_cliproxy.py --lock cliproxy.lock --target x86_64-unknown-linux-gnu --out src-tauri/binaries
          python scripts/fetch_cliproxy.py --lock cliproxy.lock --target x86_64-unknown-linux-gnu --out src-tauri/binaries --check
          python scripts/build_core.py --out src-tauri/binaries --triple x86_64-unknown-linux-gnu --run
      - name: The app's npm packages
        working-directory: app
        run: npm ci
      - name: Build and sign the installers
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python scripts/sidecars.py --config-json --release --out "$RUNNER_TEMP/tauri.json"
          npm run tauri build -- --bundles deb,appimage --config "$RUNNER_TEMP/tauri.json" -- --locked
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=app/src-tauri/target/release/bundle
          gh release upload "$TAG" "$B/deb/lokki_${VERSION}_amd64.deb" "$B/appimage/lokki_${VERSION}_amd64.AppImage" "$B/appimage/lokki_${VERSION}_amd64.AppImage.sig" -R "$GITHUB_REPOSITORY" --clobber

  release-hosted:
    name: The ${{ matrix.triple }} installers, signed
    needs: prepare
    if: ${{ inputs.platforms != 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, triple: aarch64-apple-darwin, bundles: "app,dmg", arch: aarch64 }
          - { os: macos-15-intel, triple: x86_64-apple-darwin, bundles: "app,dmg", arch: x64 }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, bundles: "nsis,msi", arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "refs/tags/${{ needs.prepare.outputs.tag }}" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, on master
        with: { toolchain: stable }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: pip install ${{ env.PYTHON_BUILD_PACKAGES }}
        shell: bash
      - run: cd ui && npm ci && npm run build
        shell: bash
      - name: Sidecars, each run once
        shell: bash
        run: cd app && python scripts/fetch_cliproxy.py --lock cliproxy.lock --target ${{ matrix.triple }} --out src-tauri/binaries && python scripts/fetch_cliproxy.py --lock cliproxy.lock --target ${{ matrix.triple }} --out src-tauri/binaries --check && python scripts/build_core.py --out src-tauri/binaries --triple ${{ matrix.triple }} --run
      - name: The app's npm packages
        shell: bash
        run: cd app && npm ci
      - name: Build and sign the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd app && python scripts/sidecars.py --config-json --release --out "$RUNNER_TEMP/tauri.json" && npm run tauri build -- --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/tauri.json" -- --locked
      - name: The Windows shell opens no console window
        if: runner.os == 'Windows'
        shell: bash
        run: python app/scripts/check_pe_subsystem.py app/src-tauri/target/release/lokki.exe --want windows
      - name: Upload to the draft, the updater archive named by version and arch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/src-tauri/target/release/bundle
          if [ -d macos ]; then
            mv macos/lokki.app.tar.gz "macos/lokki_${VERSION}_${ARCH}.app.tar.gz"
            mv macos/lokki.app.tar.gz.sig "macos/lokki_${VERSION}_${ARCH}.app.tar.gz.sig"
            gh release upload "$TAG" dmg/*.dmg "macos/lokki_${VERSION}_${ARCH}.app.tar.gz" "macos/lokki_${VERSION}_${ARCH}.app.tar.gz.sig" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release upload "$TAG" "nsis/lokki_${VERSION}_${ARCH}-setup.exe" "nsis/lokki_${VERSION}_${ARCH}-setup.exe.sig" msi/*.msi -R "$GITHUB_REPOSITORY" --clobber
          fi

  publish:
    name: latest.json, then the release
    needs: [prepare, release-linux, release-hosted]
    if: ${{ always() && needs.prepare.result == 'success' && needs.release-linux.result == 'success' && (needs.release-hosted.result == 'success' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORMS: ${{ inputs.platforms || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "refs/tags/${{ needs.prepare.outputs.tag }}" }
      - name: The manifest from the assets that are there
        working-directory: app/scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/names.txt"
          mkdir -p "$RUNNER_TEMP/sigs" && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sig' -D "$RUNNER_TEMP/sigs"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if [ "$PLATFORMS" = linux ]; then REQ=linux-x86_64; else REQ=linux-x86_64,darwin-aarch64,darwin-x86_64,windows-x86_64; fi
          python3 release_manifest.py --version "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" --names "$RUNNER_TEMP/names.txt" --signatures-dir "$RUNNER_TEMP/sigs" --require "$REQ" --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "$RUNNER_TEMP/notes.md" --out "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
