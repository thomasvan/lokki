[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lokki-core"
dynamic = ["version"]
description = "A relay that makes long Codex turns cost less, with a control API"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[tool.setuptools]
packages = ["lokki_core"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
lokki_core = ["static/**"]
